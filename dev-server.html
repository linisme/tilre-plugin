<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>til.re Plugin Development Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }

    /* Floating Panel */
    .dev-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 0;
      z-index: 1000;
      font-size: 13px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      min-width: 200px;
      max-width: 90vw;
      transition: box-shadow 0.2s;
    }

    .dev-panel:hover {
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .dev-panel.dragging {
      opacity: 0.9;
      cursor: grabbing;
    }

    /* Panel Header - Always visible */
    .dev-panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #21262d;
      border-radius: 12px 12px 0 0;
      cursor: grab;
      user-select: none;
    }

    .dev-panel.collapsed .dev-panel-header {
      border-radius: 12px;
    }

    .dev-panel-header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #58a6ff;
      flex: 1;
    }

    .dev-panel-header .header-controls {
      display: flex;
      gap: 6px;
    }

    .dev-panel-header button {
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
    }

    .dev-panel-header button:hover {
      background: #30363d;
      color: #c9d1d9;
    }

    /* Panel Body - Collapsible */
    .dev-panel-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dev-panel.collapsed .dev-panel-body {
      display: none;
    }

    .dev-panel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dev-panel label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #8b949e;
    }

    .dev-panel select,
    .dev-panel input,
    .dev-panel button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .dev-panel select {
      max-width: 150px;
    }

    .dev-panel button {
      cursor: pointer;
      font-weight: 500;
    }

    .dev-panel button:hover {
      background: #30363d;
    }

    .dev-panel button.primary {
      background: #238636;
      border-color: #238636;
    }

    .dev-panel button.primary:hover {
      background: #2ea043;
    }

    .dev-panel input[type="number"] {
      width: 60px;
    }

    .dev-controls {
      display: flex;
      gap: 6px;
    }

    .dev-controls button.active {
      background: #388bfd;
      border-color: #388bfd;
    }

    /* Parameters Section */
    .dev-params {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #30363d;
    }

    .dev-params:empty {
      display: none;
    }

    .dev-params-title {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dev-params-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    .param-group {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .param-group label {
      font-size: 11px;
      color: #8b949e;
      white-space: nowrap;
    }

    .param-group input[type="text"],
    .param-group input[type="number"] {
      width: 80px;
      padding: 4px 6px;
      font-size: 11px;
    }

    .param-group input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .param-group .param-desc {
      display: none;
    }

    .param-group:hover .param-desc {
      display: block;
      position: absolute;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #8b949e;
      max-width: 200px;
      z-index: 100;
      top: 100%;
      left: 0;
      margin-top: 4px;
      white-space: normal;
    }

    /* Timer Container - Full screen */
    #timer-container {
      min-height: 100vh;
    }

    /* Loading state */
    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    /* Resize handle */
    .dev-panel-resize {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: se-resize;
      opacity: 0.3;
    }

    .dev-panel-resize::after {
      content: '';
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #8b949e;
      border-bottom: 2px solid #8b949e;
    }

    .dev-panel.collapsed .dev-panel-resize {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Floating Development Panel -->
  <div class="dev-panel" id="dev-panel">
    <!-- Header - Draggable -->
    <div class="dev-panel-header" id="panel-header">
      <h1>🛠️ Dev Server</h1>
      <div class="header-controls">
        <button id="collapse-btn" title="Collapse">−</button>
      </div>
    </div>

    <!-- Body - Collapsible -->
    <div class="dev-panel-body">
      <div class="dev-panel-row">
        <label>
          Theme:
          <select id="theme-select">
            <option value="">Loading...</option>
          </select>
        </label>
        <button id="reload-btn" class="primary">↻</button>
      </div>

      <div class="dev-panel-row">
        <label>
          Duration:
          <input type="number" id="duration-input" value="300" min="1">s
        </label>
        <div class="dev-controls">
          <button id="pause-btn">⏸</button>
          <button id="reset-btn">↺</button>
        </div>
      </div>

      <!-- Dynamic Parameters -->
      <div class="dev-params" id="params-container"></div>
    </div>

    <!-- Resize Handle -->
    <div class="dev-panel-resize" id="panel-resize"></div>
  </div>

  <!-- Timer Rendering Container -->
  <div id="timer-container"></div>

  <!-- Mock Global Utilities (simulating til.re environment) -->
  <script>
    /**
     * Mock TimeFormatter
     * Provides time formatting utilities
     */
    window.TimeFormatter = {
      decompose(ms, units = 'hms', compact = 0) {
        const absMs = Math.abs(ms);
        const totalSeconds = Math.floor(absMs / 1000);

        const values = {
          h: Math.floor(totalSeconds / 3600),
          m: Math.floor((totalSeconds % 3600) / 60),
          s: totalSeconds % 60
        };

        const display = [];
        const unitList = units.split('').filter(u => 'hms'.includes(u));

        unitList.forEach((unit, index) => {
          const val = values[unit] || 0;
          const formatted = index === 0 ? String(val) : String(val).padStart(2, '0');
          display.push({ unit, value: val, formatted });
        });

        // Apply compact
        if (compact > 0) {
          while (display.length > compact && display[0].value === 0) {
            display.shift();
          }
        }

        const total = display.map(d => d.formatted).join(':');

        return { total, display, values, formatted: values };
      }
    };

    /**
     * Mock TimerUI
     * Creates and updates timer DOM elements
     */
    window.TimerUI = {
      create(container, units = 'hms') {
        if (!container) return null;
        container.innerHTML = '';

        const unitList = units.split('').filter(u => 'hms'.includes(u));
        const parts = [];
        const separators = [];

        unitList.forEach((unit, index) => {
          if (index > 0) {
            const sep = document.createElement('span');
            sep.className = 'separator';
            sep.textContent = ':';
            container.appendChild(sep);
            separators.push(sep);
          }

          const part = document.createElement('span');
          part.className = `time-part ${unit}`;
          part.dataset.unit = unit;
          part.textContent = '00';
          container.appendChild(part);
          parts.push(part);
        });

        return { container, parts, separators, currentUnits: unitList };
      },

      update(elements, timeData) {
        if (!elements || !timeData || !timeData.display) return;

        timeData.display.forEach((item, i) => {
          if (elements.parts[i]) {
            elements.parts[i].textContent = item.formatted;
          }
        });
      },

      destroy(elements) {
        if (elements && elements.container) {
          elements.container.innerHTML = '';
        }
      }
    };

    /**
     * Mock Audio
     * Provides sound utilities
     */
    window.Audio = {
      _enabled: true,
      isEnabled() { return this._enabled; },
      toggle() {
        this._enabled = !this._enabled;
        console.log('[Audio] Muted:', !this._enabled);
        return this._enabled;
      },
      play(type) {
        if (!this._enabled) return;
        console.log('[Audio] Playing:', type);
      },
      beep(opts) {
        if (!this._enabled) return;
        console.log('[Audio] Beep:', opts);
      }
    };

    /**
     * Mock ThemeManager
     * Manages theme registration
     */
    window.ThemeManager = {
      _themes: {},
      register(renderer) {
        this._themes[renderer.id] = renderer;
        console.log('[ThemeManager] Registered:', renderer.id);
      },
      get(id) {
        return this._themes[id];
      }
    };
  </script>

  <!-- Dev Server Logic -->
  <script>
    class DevServer {
      constructor() {
        this.container = document.getElementById('timer-container');
        this.themeSelect = document.getElementById('theme-select');
        this.durationInput = document.getElementById('duration-input');
        this.pauseBtn = document.getElementById('pause-btn');
        this.resetBtn = document.getElementById('reset-btn');
        this.reloadBtn = document.getElementById('reload-btn');
        this.paramsContainer = document.getElementById('params-container');
        this.panel = document.getElementById('dev-panel');
        this.panelHeader = document.getElementById('panel-header');
        this.collapseBtn = document.getElementById('collapse-btn');

        this.currentTheme = null;
        this.currentManifest = null;
        this.isPaused = false;
        this.remainingMs = 0;
        this.totalMs = 0;
        this.lastTick = 0;
        this.animationId = null;
        this.themes = [];

        // Drag state
        this.isDragging = false;
        this.dragOffset = { x: 0, y: 0 };

        this.init();
      }

      async init() {
        await this.loadThemeList();
        this.bindEvents();
        this.initDrag();
        this.loadTheme();
      }

      bindEvents() {
        this.reloadBtn.addEventListener('click', () => this.loadTheme());
        this.pauseBtn.addEventListener('click', () => this.togglePause());
        this.resetBtn.addEventListener('click', () => this.reset());
        this.themeSelect.addEventListener('change', () => this.onThemeChange());
        this.collapseBtn.addEventListener('click', () => this.toggleCollapse());
      }

      /**
       * Initialize drag functionality
       */
      initDrag() {
        this.panelHeader.addEventListener('mousedown', (e) => {
          if (e.target.tagName === 'BUTTON') return;
          this.isDragging = true;
          this.panel.classList.add('dragging');
          const rect = this.panel.getBoundingClientRect();
          this.dragOffset.x = e.clientX - rect.left;
          this.dragOffset.y = e.clientY - rect.top;
        });

        document.addEventListener('mousemove', (e) => {
          if (!this.isDragging) return;
          const x = e.clientX - this.dragOffset.x;
          const y = e.clientY - this.dragOffset.y;

          // Keep panel in viewport
          const maxX = window.innerWidth - this.panel.offsetWidth;
          const maxY = window.innerHeight - this.panel.offsetHeight;

          this.panel.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
          this.panel.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
          this.panel.style.right = 'auto';
        });

        document.addEventListener('mouseup', () => {
          this.isDragging = false;
          this.panel.classList.remove('dragging');
        });
      }

      /**
       * Toggle panel collapse state
       */
      toggleCollapse() {
        const isCollapsed = this.panel.classList.toggle('collapsed');
        this.collapseBtn.textContent = isCollapsed ? '+' : '−';
        this.collapseBtn.title = isCollapsed ? 'Expand' : 'Collapse';
      }

      /**
       * Load theme list from themes/index.json
       */
      async loadThemeList() {
        try {
          const res = await fetch('themes/index.json');
          const data = await res.json();
          this.themes = data.themes || [];

          // Populate select dropdown
          this.themeSelect.innerHTML = this.themes.map(theme =>
            `<option value="${theme.id}">${theme.name} (${theme.type || 'theme'})</option>`
          ).join('');

          console.log('[DevServer] Loaded themes:', this.themes.map(t => t.id));
        } catch (err) {
          console.error('[DevServer] Failed to load theme list:', err);
          this.themeSelect.innerHTML = '<option value="">Failed to load themes</option>';
        }
      }

      /**
       * Load theme manifest
       */
      async loadThemeManifest(themeId) {
        try {
          const res = await fetch(`themes/${themeId}/manifest.json`);
          return await res.json();
        } catch (err) {
          console.warn('[DevServer] No manifest found for theme:', themeId);
          return null;
        }
      }

      /**
       * Handle theme selection change
       */
      async onThemeChange() {
        const themeId = this.themeSelect.value;
        if (!themeId) return;

        // Load manifest and render params
        this.currentManifest = await this.loadThemeManifest(themeId);
        this.renderParamInputs();

        // Load the theme
        this.loadTheme();
      }

      /**
       * Render parameter inputs based on manifest
       */
      renderParamInputs() {
        this.paramsContainer.innerHTML = '';

        if (!this.currentManifest || !this.currentManifest.parameters || this.currentManifest.parameters.length === 0) {
          return;
        }

        const params = this.currentManifest.parameters;
        const defaults = this.currentManifest.defaults || {};

        // Add title
        const title = document.createElement('span');
        title.className = 'dev-params-title';
        title.textContent = 'Parameters';
        this.paramsContainer.appendChild(title);

        // Add grid container
        const grid = document.createElement('div');
        grid.className = 'dev-params-grid';

        params.forEach(param => {
          const group = document.createElement('div');
          group.className = 'param-group';

          const defaultValue = defaults[param.name] !== undefined ? defaults[param.name] : param.default;

          if (param.type === 'boolean') {
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `param-${param.name}`;
            checkbox.checked = defaultValue === true;
            checkbox.dataset.paramName = param.name;
            checkbox.dataset.paramType = 'boolean';

            const label = document.createElement('label');
            label.htmlFor = `param-${param.name}`;
            label.textContent = param.name;

            group.appendChild(checkbox);
            group.appendChild(label);
          } else {
            const label = document.createElement('label');
            label.htmlFor = `param-${param.name}`;
            label.textContent = param.name + ':';

            const input = document.createElement('input');
            input.type = param.type === 'number' ? 'number' : 'text';
            input.id = `param-${param.name}`;
            input.value = defaultValue !== undefined ? defaultValue : '';
            input.dataset.paramName = param.name;
            input.dataset.paramType = param.type;
            input.placeholder = param.description || '';

            group.appendChild(label);
            group.appendChild(input);
          }

          // Add tooltip
          if (param.description) {
            const desc = document.createElement('span');
            desc.className = 'param-desc';
            desc.textContent = param.description;
            group.appendChild(desc);
          }

          grid.appendChild(group);
        });

        this.paramsContainer.appendChild(grid);

        // Auto-reload on param change (debounced)
        grid.addEventListener('input', () => this.debouncedReload());
        grid.addEventListener('change', () => this.debouncedReload());
      }

      /**
       * Debounced reload to avoid rapid reloads
       */
      debouncedReload() {
        clearTimeout(this._reloadTimer);
        this._reloadTimer = setTimeout(() => this.loadTheme(), 300);
      }

      /**
       * Get current parameter values from inputs
       */
      getParamValues() {
        const values = {};
        const inputs = this.paramsContainer.querySelectorAll('input[data-param-name]');

        inputs.forEach(input => {
          const name = input.dataset.paramName;
          const type = input.dataset.paramType;

          if (type === 'boolean') {
            values[name] = input.checked;
          } else if (type === 'number') {
            values[name] = parseFloat(input.value) || 0;
          } else {
            values[name] = input.value;
          }
        });

        return values;
      }

      async loadTheme() {
        // Cleanup previous theme
        if (this.currentTheme && this.currentTheme.destroy) {
          this.currentTheme.destroy();
        }
        if (this.animationId) {
          cancelAnimationFrame(this.animationId);
        }

        const themeId = this.themeSelect.value;
        if (!themeId) return;

        const duration = parseInt(this.durationInput.value, 10);

        // Clear container
        this.container.innerHTML = '';

        // Remove old stylesheets
        document.querySelectorAll('link[data-theme]').forEach(el => el.remove());

        // Load manifest if not already loaded
        if (!this.currentManifest || this.currentManifest.id !== themeId) {
          this.currentManifest = await this.loadThemeManifest(themeId);
          this.renderParamInputs();
        }

        // Load theme CSS
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = `themes/${themeId}/${themeId}.css`;
        cssLink.dataset.theme = themeId;
        document.head.appendChild(cssLink);

        // Load theme JS
        try {
          // Remove old script
          document.querySelectorAll('script[data-theme]').forEach(el => el.remove());

          const script = document.createElement('script');
          script.src = `themes/${themeId}/${themeId}.js?t=${Date.now()}`;
          script.dataset.theme = themeId;

          await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
          });

          // Wait a bit for script execution
          await new Promise(r => setTimeout(r, 100));

          // Get the renderer
          const renderer = window[`TilrePlugin_${themeId}`] || window.ThemeManager.get(themeId);

          if (!renderer) {
            throw new Error(`Theme "${themeId}" not found`);
          }

          this.currentTheme = renderer;

          // Initialize
          this.totalMs = duration * 1000;
          this.remainingMs = this.totalMs;
          this.isPaused = false;

          const actions = {
            togglePause: () => this.togglePause(),
            reset: () => this.reset(),
            fullscreen: () => this.toggleFullscreen()
          };

          // Build config from defaults + user params
          const config = {
            units: 'hms',
            ...(this.currentManifest?.defaults || {}),
            ...this.getParamValues()
          };

          renderer.init(this.container, config, actions);
          renderer.setTitle('Development Mode');
          renderer.setState('active');

          // Start render loop
          this.lastTick = performance.now();
          this.tick();

          console.log(`[DevServer] Loaded theme: ${themeId}`, config);

        } catch (err) {
          console.error('[DevServer] Failed to load theme:', err);
          this.container.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f85149;">
              <div style="text-align:center;">
                <h2>Failed to load theme: ${themeId}</h2>
                <p style="opacity:0.7;margin-top:1rem;">${err.message}</p>
              </div>
            </div>
          `;
        }
      }

      tick() {
        const now = performance.now();
        const delta = now - this.lastTick;
        this.lastTick = now;

        if (!this.isPaused) {
          this.remainingMs -= delta;
        }

        const isElapsed = this.remainingMs < 0;
        const timeData = TimeFormatter.decompose(this.remainingMs, 'hms');

        if (this.currentTheme && this.currentTheme.render) {
          this.currentTheme.render(this.remainingMs, {
            state: this.isPaused ? 'paused' : (isElapsed ? 'elapsed' : 'active'),
            isElapsed,
            totalMs: this.totalMs,
            timeData,
            units: 'hms'
          });
        }

        this.animationId = requestAnimationFrame(() => this.tick());
      }

      togglePause() {
        this.isPaused = !this.isPaused;
        this.pauseBtn.textContent = this.isPaused ? '▶ Play' : '⏸ Pause';
        this.pauseBtn.classList.toggle('active', this.isPaused);

        if (this.currentTheme && this.currentTheme.setState) {
          this.currentTheme.setState(this.isPaused ? 'paused' : 'active');
        }
      }

      reset() {
        this.remainingMs = this.totalMs;
        this.isPaused = false;
        this.pauseBtn.textContent = '⏸ Pause';
        this.pauseBtn.classList.remove('active');

        if (this.currentTheme && this.currentTheme.setState) {
          this.currentTheme.setState('active');
        }
      }

      toggleFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen();
        }
      }
    }

    // Initialize dev server
    const devServer = new DevServer();
  </script>
</body>
</html>
